<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LeadsBridge</title>

    <!-- css file link -->
    <link rel="stylesheet" href="./styles/styles.css" />

    <!-- Tailwind CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Font awesome CDN -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body class="bg-[#FFFFFF] oswald_font overflow-x-hidden">
    <header class="hero-bg overflow-hidden">
      <!-- navbar -->
      <nav
        class="flex items-center justify-between py-4 px-5 mb-16 sm:py-5 sm:px-8 sm:mb-20 md:px-12 lg:py-6 lg:px-20 lg:mb-24 xl:px-28.5 xl:mb-28"
      >
        <img class="w-7 sm:w-8" src="./images/Logo.png" alt="" />

        <div class="flex items-center gap-4 sm:gap-6 md:gap-8 lg:gap-12">
          <div
            class="hidden md:flex gap-4 lg:gap-6 xl:gap-8 font-medium text-sm lg:text-base"
          >
            <a href="#" class="primary-color">Services</a>
            <a href="#" class="primary-text-color">About</a>
            <a href="#" class="primary-text-color">Contact</a>
          </div>

          <button class="btn-primary text-[12px] sm:text-[13px] lg:text-[14px]">
            Book a Free Consultation
          </button>
        </div>
      </nav>

      <!-- hero section -->
      <section class="relative pb-20 sm:pb-24 lg:pb-28 xl:pb-35">
        <!-- left part -->
        <div
          class="absolute left-[-20px] top-12 hidden lg:block lg:scale-75 xl:scale-100 xl:left-[90px] xl:top-15 rotate-[-16deg] rounded-[18px] bg-white px-8 py-5 shadow-[0_18px_30px_rgba(0,0,0,0.08)]"
        >
          <h4 class="mb-10 font-medium secondary-text-color">Total Incomes</h4>

          <div class="mb-2 flex h-[78px] items-end gap-3">
            <div class="h-[74px] w-[19px] rounded-full bg-[#EAEAEA]"></div>
            <div class="h-[95px] w-[19px] rounded-full bg-[#EAEAEA]"></div>
            <div class="h-[77px] w-[19px] rounded-full bg-[#EAEAEA]"></div>
            <div class="h-[95px] w-[19px] rounded-full bg-[#FFA500]"></div>
            <div class="h-[49px] w-[19px] rounded-full bg-[#EAEAEA]"></div>
            <div class="h-[105px] w-[19px] rounded-full bg-[#EAEAEA]"></div>
          </div>

          <div class="flex justify-between text-[7px] text-[#666666]">
            <span>Jan</span>
            <span>Feb</span>
            <span>Mar</span>
            <span>Apr</span>
            <span>May</span>
            <span>Jun</span>
          </div>
        </div>

        <!-- center part-->
        <div
          class="mx-auto flex max-w-[760px] px-5 sm:px-8 md:px-12 lg:px-16 xl:px-0 flex-col items-center text-center"
        >
          <div class="mb-4 sm:mb-5 flex items-center gap-2">
            <img
              class="w-12 sm:w-14 lg:w-16"
              src="./images/amazon_logo.png"
              alt=""
            />
            <p class="text-sm sm:text-base font-normal secondary-text-color">
              Your Full-Service
              <span class="primary-color">Amazon Partner</span>
            </p>
          </div>
          <h1
            class="max-w-[720px] text-[34px] leading-tight sm:text-[42px] md:text-[52px] lg:text-[58px] xl:text-6xl font-semibold tracking-[-1px] secondary-text-color"
          >
            Turn Your Amazon Struggles
            <br />
            into Success—Save Time,
            <br />
            <span class="primary-color">Maximize Profits!</span>
          </h1>
          <button
            class="btn-primary mt-6 sm:mt-8 text-[12px] sm:text-[13px] lg:text-[14px]"
          >
            Book a Free Consultation
          </button>
        </div>

        <!-- right part -->
        <div
          class="absolute right-[-20px] top-16 hidden lg:flex lg:scale-75 xl:scale-100 xl:right-[100px] xl:top-25 rotate-[14deg] items-center gap-3 rounded-[18px] bg-white px-4 py-4 shadow-[0_18px_30px_rgba(0,0,0,0.08)]"
        >
          <div class="flex items-center">
            <img
              src="./images/person-1.jpg"
              alt=""
              class="h-10 w-10 rounded-full border-2 border-white object-cover"
            />
            <img
              src="./images/person-2.jpg"
              alt=""
              class="-ml-3 h-10 w-10 rounded-full border-2 border-white object-cover"
            />
            <img
              src="./images/person-3.jpg"
              alt=""
              class="-ml-3 h-10 w-10 rounded-full border-2 border-white object-cover"
            />
          </div>
          <div>
            <h4 class="text-xl font-semibold secondary-text-color">
              45k+ Users
            </h4>
            <div
              class="mt-1 flex items-center gap-1 font-medium text-sm text-[#666666]"
            >
              <span class="primary-color"
                ><i class="fa-solid fa-star"></i
              ></span>
              <span>4.7 Rating</span>
            </div>
          </div>
        </div>
      </section>
    </header>
    <main></main>
    <footer></footer>
  </body>
</html>
